name: Cosine

on:
  push:
    paths:
      - "cosine/**"
      - ".github/workflows/cosine.yml"
  pull_request:
    paths:
      - "cosine/**"
      - ".github/workflows/cosine.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cosine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cosine/go.mod
          cache-dependency-path: cosine/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # The real yt-dlp checks that every flag Cosine passes is still accepted.
      - name: Install yt-dlp
        run: pipx install yt-dlp && yt-dlp --version

      - name: Test
        run: go test -race ./...

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/cosine-linux-amd64 ./cmd/cosine
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/cosine-linux-arm64 ./cmd/cosine

      - uses: actions/upload-artifact@v4
        with:
          name: cosine
          path: cosine/dist/
          if-no-files-found: error
