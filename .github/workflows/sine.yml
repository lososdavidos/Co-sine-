name: Sine

on:
  push:
    paths:
      - "sine/**"
      - ".github/workflows/sine.yml"
  pull_request:
    paths:
      - "sine/**"
      - ".github/workflows/sine.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: VLC, for the desktop's playback tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc5 vlc-plugin-base

      - name: Core and desktop tests
        run: ./gradlew :core:test :desktop:test --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sine-debug-apk
          path: sine/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sine-desktop-screens
          path: sine/desktop/build/screens/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sine/core/build/reports/tests/
            sine/desktop/build/reports/tests/
