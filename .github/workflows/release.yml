name: Release

# Publishes a release: static Cosine binaries, the installer, and an
# installable Sine APK, with one checksum file for all. The installer
# downloads from here. Start it by pushing a tag like v0.2.0, or from the
# Actions tab ("Run workflow") with a version, which creates the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (tags the chosen branch's head)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  cosine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cosine/go.mod
          cache-dependency-path: cosine/go.sum

      - name: Check the version
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Not a version: $TAG"
            exit 1
          fi

      - name: Test
        working-directory: cosine
        run: go test ./...

      - name: Build
        working-directory: cosine
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o ../dist/cosine-linux-$arch ./cmd/cosine
          done
          cp ../deploy/install.sh ../dist/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cosine
          path: dist/

  sine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the APK
        working-directory: sine
        run: |
          ./gradlew :core:test :app:assembleRelease \
            -PsineVersionName="${TAG#v}" -PsineVersionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/sine-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sine
          path: dist/

  publish:
    needs: [cosine, sine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Server (Proxmox LXC or any Debian/Ubuntu):** inside the container, run
            ```sh
            bash -c "$(curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/install.sh)"
            ```
            then open `http://<container-ip>:4534/` to set it up. Guide: [deploy/README.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/deploy/README.md).

            **Android:** download `sine-${{ env.TAG }}.apk` on the phone and install it (allow installs from your browser when asked). Later releases install over it.

            This is a testing build: signed with a key committed to the repository, not a store key.
