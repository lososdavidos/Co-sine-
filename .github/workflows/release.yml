name: Release

# Push a tag like v0.2.0 to publish static Cosine binaries, their checksums
# and the installer as a GitHub release. The installer downloads from here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cosine/go.mod
          cache-dependency-path: cosine/go.sum

      - name: Test
        working-directory: cosine
        run: go test ./...

      - name: Build
        working-directory: cosine
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/cosine-linux-$arch ./cmd/cosine
          done
          cp ../deploy/install.sh ../dist/install.sh
          cd ../dist && sha256sum cosine-linux-* install.sh > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
