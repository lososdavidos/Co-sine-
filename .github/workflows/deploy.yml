name: Installer

on:
  push:
    paths:
      - "deploy/**"
      - "cosine/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash deploy/install.sh

  # Runs the installer end to end in clean Debian and Ubuntu images: real
  # package names, real yt-dlp and Deno downloads with checksums, a rerun as
  # an upgrade, and uninstall. (No systemd in a container: services are
  # written and checked, then Cosine is started by hand.)
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "debian:bookworm", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cosine/go.mod
          cache-dependency-path: cosine/go.sum

      - name: Build cosine
        working-directory: cosine
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-X main.version=ci" -o ../cosine-linux-amd64 ./cmd/cosine

      - name: Install, upgrade, run and uninstall in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} bash -euxc '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            # What earlier installers left: the single-file build, self-updating.
            printf "#!/bin/sh\necho 2020.01.01\n" >/usr/local/bin/yt-dlp && chmod +x /usr/local/bin/yt-dlp
            ./deploy/install.sh --binary ./cosine-linux-amd64 --with-fingerprinting
            # Replaced by the folder build, which runs for the service account
            # and which the daily updater finds current.
            grep -q /opt/yt-dlp/current /usr/local/bin/yt-dlp
            test "$(readlink /opt/yt-dlp/current)" = "$(runuser -u cosine -- yt-dlp --version)"
            /opt/cosine/libexec/update-yt-dlp | grep -q "already the latest"
            grep -q "ExecStart=/opt/cosine/libexec/update-yt-dlp" /etc/systemd/system/yt-dlp-update.service
            out="$(./deploy/install.sh --binary ./cosine-linux-amd64)"; echo "$out"
            grep -q "Kept your existing settings" <<<"$out"
            grep -q "Already installed:" <<<"$out"         # a rerun skips apt
            grep -q "already the latest" <<<"$out"          # and current downloads
            out="$(./deploy/install.sh --binary ./cosine-linux-amd64 --reinstall)"; echo "$out"
            if grep -qi "already" <<<"$out"; then echo "--reinstall skipped something"; exit 1; fi
            test "$(ls /opt/yt-dlp)" = "$(printf "%s\n" "$(readlink /opt/yt-dlp/current)" current)"  # one version, reinstalled
            command -v yt-dlp deno ffprobe fpcalc sqlite3
            systemd-analyze verify /etc/systemd/system/cosine.service /etc/systemd/system/*.timer 2>/dev/null || true
            runuser -u cosine -- env $(grep -v "^#" /etc/cosine/cosine.env | xargs) /opt/cosine/bin/cosine &
            for i in $(seq 1 20); do curl -fsS localhost:4534/cosine/v1/capabilities && break; sleep 0.5; done
            curl -fsS localhost:4534/cosine/v1/capabilities | grep -q ingest
            kill %1
            ./deploy/install.sh --uninstall --purge
            test ! -e /opt/cosine && test ! -e /var/lib/cosine && test -d /srv/music/store
          '

  # The path people actually take: no local binary, Cosine downloaded from
  # the latest published release and checked against its SHA256SUMS.
  from-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the latest release in debian:trixie
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash -euxc '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            ./deploy/install.sh --no-deno
            /opt/cosine/bin/cosine -version | grep -q "^v"
            runuser -u cosine -- env $(grep -v "^#" /etc/cosine/cosine.env | xargs) /opt/cosine/bin/cosine &
            for i in $(seq 1 20); do curl -fsS localhost:4534/cosine/v1/capabilities && break; sleep 0.5; done
            curl -fsS -o /dev/null -w "%{http_code}" localhost:4534/ | grep -q 303
          '
