{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Cosine</title>
<!-- Deliberately unstyled: the design language is being replaced. -->
<style>body{font-family:system-ui,sans-serif;max-width:60rem;margin:1rem auto;padding:0 1rem}table{border-collapse:collapse}td,th{text-align:left;padding:.25rem .75rem .25rem 0}label{display:block;margin:.5rem 0}.err{color:#b00}.ok{color:#070}.bar{display:inline-block;height:.8em;background:currentColor;vertical-align:middle}button.destroy{background:#b00;color:#fff;border:0;padding:.3rem .6rem}.apart{margin-top:2rem}</style>
</head>
<body>
{{if .User}}<nav><a href="/">Status</a> · <a href="/review">Review</a> · <a href="/listening">Listening</a> · <a href="/corrections">Corrections</a> · <a href="/users">Accounts</a> · <a href="/settings">Settings</a> ·
<form method="post" action="/logout" style="display:inline"><button>Log out {{.User.Name}}</button></form></nav>{{end}}
<h1>{{.Title}}</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
{{if .Done}}<p class="ok">{{.Done}}</p>{{end}}
{{template "content" .}}
</body>
</html>{{end}}
