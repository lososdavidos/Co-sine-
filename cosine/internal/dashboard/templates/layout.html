{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B0C">
<title>{{.Title}} · Cosine</title>
<!-- Phase (§6.18): the same design language as Sine. -->
<link rel="preload" href="/static/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/phase.css">
</head>
<body>
<div class="page">
<header class="top">
<a class="mark" href="/"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="13" cy="17" r="11" fill="none" stroke="#45454B" stroke-width="1.5"/><line x1="13" y1="17" x2="20.1" y2="17" stroke="#46D3E6" stroke-width="3"/><line x1="20.1" y1="17" x2="20.1" y2="8.6" stroke="#D7F144" stroke-width="3"/><circle cx="20.1" cy="8.6" r="2.5" fill="#F3F3F0"/></svg>Cosine</a>
{{if .User}}<div class="who"><span class="label">{{.User.Name}} · admin</span><form method="post" action="/logout"><button class="quiet">Log out</button></form></div>{{end}}
</header>
{{if .User}}<nav class="main" aria-label="Dashboard">
<a href="/"{{if eq .Title "Status"}} aria-current="page"{{end}}>Status</a>
<a href="/review"{{if eq .Title "Review"}} aria-current="page"{{end}}>Review</a>
<a href="/listening"{{if eq .Title "Listening"}} aria-current="page"{{end}}>Listening</a>
<a href="/corrections"{{if eq .Title "Corrections"}} aria-current="page"{{end}}>Corrections</a>
<a href="/users"{{if eq .Title "Accounts"}} aria-current="page"{{end}}>Accounts</a>
<a href="/settings"{{if eq .Title "Settings"}} aria-current="page"{{end}}>Settings</a>
</nav>{{end}}
<main>
<h1>{{.Title}}</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
{{if .Done}}<p class="ok">{{.Done}}</p>{{end}}
{{template "content" .}}
</main>
</div>
</body>
</html>{{end}}
